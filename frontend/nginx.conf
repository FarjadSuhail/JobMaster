server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container (service name from compose.yaml)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;  # AI generations can take a while
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
