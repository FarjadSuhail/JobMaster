spring.application.name=JobMaster Backend

# ---------------------------------------------------------------------------
# Database — PostgreSQL (default). Matches the local postgres-dev Docker
# container. If Postgres isn't running, use the embedded fallback instead:
#   ./gradlew bootRun --args='--spring.profiles.active=h2'
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobmaster}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# AI provider selection. Spring AI abstracts the vendor behind ChatClient, so
# switching provider is just: AI_PROVIDER=anthropic (plus its API key).
# Supported here out of the box: openai | anthropic. Adding another vendor
# later = add its spring-ai starter to build.gradle + its properties below.
# ---------------------------------------------------------------------------
spring.ai.model.chat=${AI_PROVIDER:openai}

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.4

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-sonnet-4-5}
spring.ai.anthropic.chat.options.temperature=0.4
spring.ai.anthropic.chat.options.max-tokens=8192

# ---------------------------------------------------------------------------
# Job watcher: checks watched companies' career portals daily and surfaces
# new postings in the Jobs tab. A catch-up run fires on startup when the last
# successful run is older than ~20h (covers "laptop was asleep at 11:00").
# ---------------------------------------------------------------------------
jobmaster.watcher.enabled=${WATCHER_ENABLED:true}
# Default: daily at 11:00. On a server, checking every 2h during the day
# (WATCHER_CRON=0 0 7-21/2 * * *) makes you one of the first applicants.
jobmaster.watcher.cron=${WATCHER_CRON:0 0 11 * * *}
jobmaster.watcher.zone=Europe/Berlin

# ---------------------------------------------------------------------------
# Telegram notifications for new postings. Empty = disabled. Setup: message
# @BotFather → /newbot → copy the token; then message your new bot once and
# read your chat id from https://api.telegram.org/bot<TOKEN>/getUpdates.
# Test with: POST /api/watch/telegram-test
# ---------------------------------------------------------------------------
jobmaster.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
jobmaster.telegram.chat-id=${TELEGRAM_CHAT_ID:}

# ---------------------------------------------------------------------------
# Dashboard: applications created before this date are excluded from the
# funnel stats and skill-gap lists (tracking started fresh on this day).
# ---------------------------------------------------------------------------
jobmaster.dashboard.start-date=${DASHBOARD_START_DATE:2026-07-08}

# ---------------------------------------------------------------------------
# Token prices in USD per 1M tokens, used for the Usage tab. Update here when
# vendors change prices; models without an entry show cost as "unknown".
# Keys with dots need brackets: jobmaster.pricing.models.[gpt-4.1].input-per-mtok
# ---------------------------------------------------------------------------
jobmaster.pricing.models.mock.input-per-mtok=0
jobmaster.pricing.models.mock.output-per-mtok=0
jobmaster.pricing.models.[gpt-5.5].input-per-mtok=5
jobmaster.pricing.models.[gpt-5.5].output-per-mtok=30
jobmaster.pricing.models.[gpt-5.4-nano].input-per-mtok=0.20
jobmaster.pricing.models.[gpt-5.4-nano].output-per-mtok=1.25
jobmaster.pricing.models.[gpt-5.4].input-per-mtok=2.50
jobmaster.pricing.models.[gpt-5.4].output-per-mtok=15
jobmaster.pricing.models.gpt-4o-mini.input-per-mtok=0.15
jobmaster.pricing.models.gpt-4o-mini.output-per-mtok=0.60
jobmaster.pricing.models.gpt-4o.input-per-mtok=2.50
jobmaster.pricing.models.gpt-4o.output-per-mtok=10
jobmaster.pricing.models.[gpt-4.1].input-per-mtok=2
jobmaster.pricing.models.[gpt-4.1].output-per-mtok=8
jobmaster.pricing.models.[gpt-4.1-mini].input-per-mtok=0.40
jobmaster.pricing.models.[gpt-4.1-mini].output-per-mtok=1.60
jobmaster.pricing.models.claude-sonnet-4-5.input-per-mtok=3
jobmaster.pricing.models.claude-sonnet-4-5.output-per-mtok=15
jobmaster.pricing.models.claude-haiku-4-5.input-per-mtok=1
jobmaster.pricing.models.claude-haiku-4-5.output-per-mtok=5
